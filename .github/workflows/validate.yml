name: Bootstrap validation
on:
  push:
    branches: [main, feat/fl-002-monorepo-bootstrap]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.12.19
      - name: Install locked application and development dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format
        run: uv run --locked ruff format --check .
      - name: Type check
        run: uv run --locked mypy src tests tests_db tests_broker migrations
      - name: Test
        run: uv run --locked pytest

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks 8.30.1 (MIT CLI)
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan full Git history and working tree (redacted output)
        run: |
          /tmp/gitleaks git --redact --no-banner .
          /tmp/gitleaks dir --redact --no-banner .
